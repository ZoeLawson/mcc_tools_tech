name: properties to HTML
'on':
#   workflow_dispatch:
  push:
    branches:
    - Winter2025
    paths:
    - 'Week02-ProgressiveInfo/Homework/ZoeLawson.properties'
jobs:
  transform:
    name: Transform Java Properties file to HTML example
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Check file existence
      id: check_files
      uses: andstor/file-existence-action@v3
      with:
        files: "ZoeLawson.properties"
    - name: Install libsaxonb-java
      if: steps.check_files.outputs.files_exists == 'true'
      run: sudo apt-get install libsaxonb-java
    - name: Run transform
      if: steps.check_files.outputs.files_exists == 'true'
      run: saxonb-xslt -s:'Week02-ProgressiveInfo/Homework/xsl/dummy.xml' -xsl:'Week02-ProgressiveInfo/Homework/xsl/BuildLoginPage.xslt' -o:'Week02-ProgressiveInfo/Homework/ZoeLawson.html' propertiesFile='../ZoeLawson.properties'
    - name: Set time stamp
      id: timestamp
      run: echo "timestamp=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
    - name: Upload transform output
      uses: actions/upload-artifact@v4
      with:
        name: ZoeHomework
        path: 'Week02-ProgressiveInfo/Homework'
    - uses: oleksiyrudenko/gha-git-credentials@v2-latest
      with:
        token: '${{ secrets.GITHUB_TOKEN }}'
      if: steps.check_files.outputs.files_exists == 'true'
      run: |
        git add Week02-ProgressiveInfo/Homework/ZoeLawson.html
        git commit -m "generated html file from ZoeLawson.properties $timestamp"
        git push origin Winter2025
      